name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up env file
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_hex(32))')/" .env
      - name: Build and start application
        run: docker compose up -d --build --wait
      - name: Integration tests
        run: docker compose --profile test run --build --rm tests
      - name: Lint and formatting
        run: |
          docker compose --profile test run --rm tests ruff check --no-cache app tests benchmarks replication
          docker compose --profile test run --rm tests ruff format --check --no-cache app tests benchmarks replication
      - name: Postman collection
        run: npx --yes newman@6.2.3 run postman/social-network.postman_collection.json -e postman/local.postman_environment.json
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down -v

  replication:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up env file
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_hex(32))')/" .env
      - name: Install benchmark dependencies
        run: python -m pip install -r requirements-benchmark.txt
      - name: Read routing and both crash experiments on a small dataset
        run: python -m replication.run --rows 10000 --duration 2 --warmup 1 --repetitions 1 --concurrency 1 10
      - name: Replica transaction and availability tests
        run: >-
          docker compose -f compose.replication.yaml --profile test run --build --rm
          -e RUN_REPLICATION_TESTS=1 tests pytest -q tests/test_replication.py
      - name: Keep measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replication-evidence
          path: reports/replication
      - name: Stop containers
        if: always()
        run: |
          for project in social-replication social-replication-async social-replication-quorum; do
            docker compose -p "$project" -f compose.replication.yaml down -v
          done
