name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up env file
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_hex(32))')/" .env
      - name: Build and start application
        run: docker compose up -d --build --wait
      - name: Integration tests
        run: docker compose --profile test run --build --rm tests
      - name: Lint and formatting
        run: |
          docker compose --profile test run --rm tests ruff check --no-cache app tests
          docker compose --profile test run --rm tests ruff format --check --no-cache app tests
      - name: Postman collection
        run: npx --yes newman@6.2.3 run postman/social-network.postman_collection.json -e postman/local.postman_environment.json
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down -v
