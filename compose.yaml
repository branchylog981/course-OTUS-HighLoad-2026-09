services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social}
      POSTGRES_USER: ${POSTGRES_USER:-social}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    environment: &app-env
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-social}
      PGUSER: ${POSTGRES_USER:-social}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.migrate"]

  app:
    build: .
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  tests:
    build: .
    profiles: ["test"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./postman:/app/postman:ro
    command: ["pytest", "-q", "-p", "no:cacheprovider"]

volumes:
  postgres_data:
